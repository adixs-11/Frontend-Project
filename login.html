<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizHive — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="noise"></div>

  <nav class="navbar">
    <a href="index.html" class="back-btn"><span class="back-arrow">←</span> Back</a>
    <div class="logo-center">QuizHive</div>
    <div class="nav-right">
      <a href="about.html" class="btn-nav">About</a>
      <a href="categories.html" class="btn-nav">Play</a>
    </div>
  </nav>

  <main class="login-wrapper">
    <div class="login-card">

      <div class="card-header">
        <div class="header-rule"></div>
        <p class="eyebrow">Welcome Back</p>
        <h1>Sign in to<br><em>QuizHive</em></h1>
        <div class="header-rule"></div>
      </div>


      <div class="tab-row">
        <button class="tab active" id="tab-login" onclick="switchTab('login')">Sign In</button>
        <button class="tab" id="tab-register" onclick="switchTab('register')">Register</button>
      </div>

      <div class="form-panel" id="panel-login">
        <div class="field-group">
          <label class="field-label" for="login-user">Username</label>
          <input class="field-input" id="login-user" type="text" placeholder="your username" autocomplete="username">
        </div>
        <div class="field-group">
          <label class="field-label" for="login-pass">Password</label>
          <div class="pass-wrap">
            <input class="field-input" id="login-pass" type="password" placeholder="••••••••" autocomplete="current-password">
            <button class="pass-toggle" type="button" onclick="togglePass('login-pass', this)" title="Show password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>
        <div id="login-error" class="form-error" style="display:none;"></div>
        <button class="submit-btn" onclick="handleLogin()">Sign In →</button>
        <p class="form-note">Don't have an account? <span class="link" onclick="switchTab('register')">Register</span></p>
      </div>


      <div class="form-panel hidden" id="panel-register">
        <div class="field-group">
          <label class="field-label" for="reg-user">Choose a Username</label>
          <input class="field-input" id="reg-user" type="text" placeholder="e.g. quizmaster99" autocomplete="username">
        </div>
        <div class="field-group">
          <label class="field-label" for="reg-pass">Password</label>
          <div class="pass-wrap">
            <input class="field-input" id="reg-pass" type="password" placeholder="min. 6 characters" autocomplete="new-password">
            <button class="pass-toggle" type="button" onclick="togglePass('reg-pass', this)" title="Show password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="field-group">
          <label class="field-label" for="reg-pass2">Confirm Password</label>
          <input class="field-input" id="reg-pass2" type="password" placeholder="repeat password" autocomplete="new-password">
        </div>
        <div id="reg-error" class="form-error" style="display:none;"></div>
        <button class="submit-btn" onclick="handleRegister()">Create Account →</button>
        <p class="form-note">Already registered? <span class="link" onclick="switchTab('login')">Sign In</span></p>
      </div>

    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <span class="footer-logo">QuizHive</span>
      <span class="footer-dot">◆</span>
      <span>© 2026 • Learn with fun</span>
    </div>
  </footer>

  <script src="index.js"></script>
  <script>
    const USERS_KEY = "quizhive_users";
    const SESSION_KEY = "quizhive_session";

function switchTab(tab) {
  var loginPanel = document.getElementById("panel-login");
  var registerPanel = document.getElementById("panel-register");
  var loginTab = document.getElementById("tab-login");
  var registerTab = document.getElementById("tab-register");

  if (tab === "login") {
    loginPanel.classList.remove("hidden");
    registerPanel.classList.add("hidden");
    loginTab.classList.add("active");
    registerTab.classList.remove("active");
  } else {
    loginPanel.classList.add("hidden");
    registerPanel.classList.remove("hidden");
    loginTab.classList.remove("active");
    registerTab.classList.add("active");
  }

  clearErrors();
}

function clearErrors() {
  var loginError = document.getElementById("login-error");
  var regError = document.getElementById("reg-error");

  loginError.style.display = "none";
  loginError.textContent = "";

  regError.style.display = "none";
  regError.textContent = "";
}

function showError(id, msg) {
  var errorBox = document.getElementById(id);

  errorBox.textContent = msg;
  errorBox.style.display = "block";

  errorBox.classList.remove("animate-in");
  setTimeout(function () {
    errorBox.classList.add("animate-in");
  }, 10);
}

function togglePass(inputId, btn) {
  var input = document.getElementById(inputId);

  if (input.type === "password") {
    input.type = "text";
    btn.style.color = "var(--accent)";
  } else {
    input.type = "password";
    btn.style.color = "";
  }
}

function getUsers() {
  var savedUsers = localStorage.getItem(USERS_KEY);

  if (savedUsers === null) {
    return {};
  }

  return JSON.parse(savedUsers);
}

function saveUsers(users) {
  var usersText = JSON.stringify(users);
  localStorage.setItem(USERS_KEY, usersText);
}

function getRedirectPage() {
  var searchText = window.location.search;

  if (searchText.indexOf("next=") === -1) {
    return "index.html";
  }

  var nextPart = searchText.split("next=")[1];
  var pageName = nextPart.split("&")[0];

  return pageName;
}

function handleLogin() {
  var user = document.getElementById("login-user").value.trim();
  var pass = document.getElementById("login-pass").value;
  if (user === "" || pass === "") {
    showError("login-error", "Please fill in all fields.");
    return;
  }

  var users = getUsers();

  if (users[user] === undefined) {
    showError("login-error", "Username not found.");
    return;
  }

  if (users[user].password !== btoa(pass)) {
    showError("login-error", "Incorrect password.");
    return;
  }

  var session = {
    username: user
  };

  localStorage.setItem(SESSION_KEY, JSON.stringify(session));

  window.location.href = getRedirectPage();
}

function handleRegister() {
  var user = document.getElementById("reg-user").value.trim();
  var pass = document.getElementById("reg-pass").value;
  var pass2 = document.getElementById("reg-pass2").value;

  if (user === "" || pass === "" || pass2 === "") {
    showError("reg-error", "Please fill in all fields.");
    return;
  }

  if (user.length < 3) {
    showError("reg-error", "Username must be at least 3 characters.");
    return;
  }

  if (pass.length < 6) {
    showError("reg-error", "Password must be at least 6 characters.");
    return;
  }

  if (pass !== pass2) {
    showError("reg-error", "Passwords do not match.");
    return;
  }

  var users = getUsers();

  if (users[user] !== undefined) {
    showError("reg-error", "Username already taken.");
    return;
  }

  users[user] = {
    password: btoa(pass),
    joined: new Date().toISOString()
  };

  saveUsers(users);

  var session = {
    username: user
  };

  localStorage.setItem(SESSION_KEY, JSON.stringify(session));

  window.location.href = getRedirectPage();
}

document.addEventListener("keydown", function (event) {
  if (event.key === "Enter") {
    var loginPanel = document.getElementById("panel-login");

    if (loginPanel.classList.contains("hidden")) {
      handleRegister();
    } else {
      handleLogin();
    }
  }
});

  </script>
</body>
</html>
