<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizHive — Result</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="result.css">
</head>

<body>
  <script src="js/auth.js"></script>
  <div class="noise"></div>

  <nav class="navbar">
    <a href="categories.html" class="back-btn"><span class="back-arrow">←</span> Back</a>
    <div class="logo-center">QuizHive</div>
    <div class="nav-placeholder"></div>
  </nav>

  <main class="result-wrapper">
    <div class="result-container">

      <div class="result-eyebrow">Quiz Complete</div>

      <div class="category-row">
        <span class="category-label">Category</span>
        <span id="category_text" class="category-val"></span>
      </div>

      <div class="score-display">
        <span class="score-num" id="scoreText"></span>
        <span class="score-denom">/ 8</span>
      </div>

      <p class="score-msg" id="scoreMsg"></p>

      <div class="result-rule"></div>

      <div class="result-actions">
        <a href="categories.html" class="btn-primary">Play Again →</a>
        <a href="leaderboard.html" class="btn-ghost">View Scores</a>
      </div>

    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <span class="footer-logo">QuizHive</span>
      <span class="footer-dot">◆</span>
      <span>© 2026 • Keep learning</span>
    </div>
  </footer>

  <script>
    const params = new URLSearchParams(window.location.search);
    const score = parseInt(params.get('score'));
    let category = params.get('category');

    if (category === 'sport') category = 'Sports';
    else if (category === 'pop') category = 'Pop Culture';
    else if (category === 'smart') category = 'Everyday Smart';
    else if (category === 'personality') category = 'Personality';

    document.getElementById('scoreText').innerText = score;
    document.getElementById('category_text').innerText = category;

    const msgs = [
      'Perfect score. Absolutely flawless.',
      'Sharp mind. You really know your stuff.',
      'Solid effort — keep pushing.',
      'Every expert was once a beginner.'
    ];
    let text = 0;

    if (score == 8){
      text = msgs[0];
    } 
    else if (score == 7 ||score == 6){
      text = msgs[1];
    }
    else if (score == 5 || score == 4){
      text = msgs[2];
    }
    else {
      text = msgs[3];
    }

    document.getElementById('scoreMsg').innerText = text;
    console.log(text);
  </script>

<script src="index.js"></script>
<script src="js/save-score.js"></script>

<script>
  saveScore(score, category);
</script>

</body>
</html>
