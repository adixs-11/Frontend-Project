<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizHive — Leaderboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="leaderboard.css">
</head>

<body>
  <script src="js/auth.js"></script>
  <div class="noise"></div>

  <nav class="navbar">
    <a href="index.html" class="back-btn">
      <span class="back-arrow">←</span> Back
    </a>
    <div class="logo-center">QuizHive</div>
    <a href="categories.html" class="btn-nav">Play</a>
  </nav>

  <main class="lb-main">

    <header class="lb-header">
      <div class="header-rule"></div>
      <p class="eyebrow">Your History</p>
      <h1>Past <em>Attempts</em></h1>
      <div class="header-rule"></div>
    </header>


    <div class="history-container">

      <div class="table-head">
        <span>#</span>
        <span>Category</span>
        <span>Score</span>
        <span>Rank</span>
      </div>

      <div id="leaderboardList"></div>

    </div>

    <div class="lb-footer-cta">
      <a href="categories.html" class="cta-btn">
        Play Another Round →
      </a>
    </div>

  </main>

  <footer class="footer">
    <div class="footer-inner">
      <span class="footer-logo">QuizHive</span>
      <span class="footer-dot">◆</span>
      <span>© 2026 • Built with curiosity</span>
    </div>
  </footer>

  <script src="index.js"></script>

<script src="leaderboard.js"></script>

</body>
</html>
